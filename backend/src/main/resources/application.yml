server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
spring:
  application:
    name: roast-me
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:54329/roastme}
    username: ${DATABASE_USER:roastme}
    password: ${DATABASE_PASSWORD}
  flyway:
    clean-disabled: true
    validate-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  backend-user: ${BACKEND_USER}
  backend-password: ${BACKEND_PASSWORD}
  stub-video: ${STUB_VIDEO_ENABLED:false}
  daily-limit-micro-usd: ${DAILY_LIMIT_MICRO_USD:0}
  video-timeout-seconds: ${STUB_VIDEO_TIMEOUT_SECONDS:600}
