services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roastme
      POSTGRES_USER: roastme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roastme"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
